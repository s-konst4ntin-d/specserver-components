<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход для сотрудников | Белый Ветер</title>
  <link rel="stylesheet" href="/admin/admin.css?v=20260903-admin-fixes">
  <script defer src="/admin/lucide.js"></script>
  <script defer src="/admin/admin.js?v=20260903-live-filters"></script>
</head>
<body class="login-page">
  <main class="login-main">
    <a class="brand" href="/"><img src="/assets/beliy-veter-logo.png" alt="Белый Ветер" width="154" height="62"></a>
    <h1>Кабинет сотрудника</h1>
    <form id="adminLogin">
      <label>Телефон или email<input name="login" autocomplete="username" required maxlength="160" autofocus></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="256"></label>
      <p id="loginError" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">Войти</button>
    </form>
    <a class="back-link" href="/">Вернуться на сайт</a>
  </main>
</body>
</html>
